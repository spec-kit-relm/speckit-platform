schema_version: "1.0"

bundle:
  id: "relm-backend"
  name: "Relm backend setup"
  version: "1.0.0"
  role: "developer"
  description: "Everything a Relm backend repository needs: org + backend presets, git, github and relm extensions."
  author: "Relm SDD Guild"
  license: "MIT"

requires:
  speckit_version: ">=1.2.0"

provides:
  presets:
    - id: "relm-org"
      version: "1.0.0"
      priority: 20
      strategy: "replace"
      source: "relm"
    - id: "relm-backend"
      version: "1.0.0"
      priority: 10
      strategy: "append"
      source: "relm"
  extensions:
    - id: "git"
      version: "1.0.8"
    - id: "github"
      version: "1.0.6"
    - id: "relm"
      version: "1.0.0"
      source: "relm"

tags: ["relm", "backend", "governance"]
