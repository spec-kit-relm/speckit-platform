# CI for speckit-platform itself.
name: platform-ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  generated-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Presets + governance history are generated from governance/
        run: python scripts/relm_sdd.py build --check
      - name: Catalogs match the deterministic packages
        run: python scripts/relm_sdd.py catalog --check --tag "v$(cat VERSION)"
      - name: Unit tests
        run: python -m unittest discover -s tests -v

  install-smoke-test:
    # Proves the presets/extension install and compose with the pinned Spec Kit CLI.
    runs-on: ubuntu-latest
    needs: generated-files
    strategy:
      matrix:
        kind: [product, backend, frontend, qa]
    steps:
      - uses: actions/checkout@v4
        with: { path: speckit-platform }
      - uses: astral-sh/setup-uv@v6
      - name: Install pinned Spec Kit
        run: uv tool install specify-cli --from "git+https://github.com/github/spec-kit.git@v$(cat speckit-platform/SPECKIT_VERSION)"
      - name: Bootstrap a throwaway ${{ matrix.kind }} repo
        run: |
          mkdir smoke && cd smoke && git init -q
          bash ../speckit-platform/bootstrap/init-repo.sh ${{ matrix.kind }} --platform ../speckit-platform
          grep -q "BEGIN RELM:ORG-BASELINE" .specify/memory/constitution.md
          grep -q "BEGIN RELM:TEAM-$(echo ${{ matrix.kind }} | tr a-z A-Z)" .specify/memory/constitution.md
          test -f .claude/skills/speckit-relm-handoff/SKILL.md
