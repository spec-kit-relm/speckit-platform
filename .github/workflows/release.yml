# Tag vX.Y.Z -> GitHub release with deterministic preset/extension zips (referenced by catalogs/*.json),
# then move the floating major tag (v1) used by the reusable workflows.
name: release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Verify catalog matches this tag
        run: python scripts/relm_sdd.py catalog --check --tag "${GITHUB_REF_NAME}"
      - name: Package
        run: python scripts/relm_sdd.py package --out dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.zip \
            --title "speckit-platform $GITHUB_REF_NAME" \
            --notes-file <(sed -n "/^## \[${GITHUB_REF_NAME#v}\]/,/^## \[/p" CHANGELOG.md | sed '$d') \
            || gh release upload "$GITHUB_REF_NAME" dist/*.zip --clobber
      - name: Move floating major tag
        run: |
          major="${GITHUB_REF_NAME%%.*}"
          git tag -f "$major" && git push -f origin "$major"
